<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excelsis — Asistente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171c;
    --panel:#1b1f26;
    --panel-raised:#232833;
    --hairline:#2d3340;
    --text:#edeef0;
    --muted:#8a8f98;
    --amber:#e2273b;
    --amber-dim:#4a1c22;
    --mint:#f0707f;
    --bubble-bot:#262b33;
    --bubble-user:#331d20;
    --radius:14px;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    background-image:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(226,39,59,0.12), transparent 60%);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  .app{
    width:100%;
    max-width:560px;
    height:min(760px, calc(100vh - 48px));
    background:var(--panel);
    border:1px solid var(--hairline);
    border-radius:20px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.6);
    position:relative;
  }

  .app::before{
    content:"";
    position:absolute;
    top:0; left:0; right:0;
    height:120px;
    background:radial-gradient(ellipse 70% 100% at 50% 0%, rgba(226,39,59,0.18), transparent 70%);
    pointer-events:none;
  }

  header{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px 22px 16px;
    border-bottom:1px solid var(--hairline);
    position:relative;
    z-index:1;
  }

  .avatar{
    width:40px; height:40px;
    border-radius:11px;
    background:#ffffff;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    overflow:hidden;
    box-shadow:0 0 0 1px var(--hairline);
  }
  .avatar img{
    width:72%;
    height:72%;
    object-fit:contain;
  }

  .header-text{flex:1; min-width:0;}

  .header-text h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:17px;
    margin:0;
    letter-spacing:0.01em;
  }

  .status{
    display:flex; align-items:center; gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:11.5px;
    color:var(--muted);
    margin-top:2px;
  }

  .status .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--mint);
    box-shadow:0 0 0 3px rgba(240,112,127,0.18);
    animation:breathe 2.4s ease-in-out infinite;
  }

  @keyframes breathe{
    0%,100%{opacity:1;}
    50%{opacity:0.4;}
  }

  .clear-btn{
    background:none;
    border:1px solid var(--hairline);
    color:var(--muted);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    padding:6px 10px;
    border-radius:8px;
    cursor:pointer;
    transition:border-color 0.15s, color 0.15s;
  }
  .clear-btn:hover{border-color:var(--amber); color:var(--amber);}
  .clear-btn:focus-visible{outline:2px solid var(--amber); outline-offset:2px;}

  main{
    flex:1;
    overflow-y:auto;
    padding:22px;
    display:flex;
    flex-direction:column;
    gap:14px;
    position:relative;
    z-index:1;
    scroll-behavior:smooth;
  }

  main::-webkit-scrollbar{width:8px;}
  main::-webkit-scrollbar-thumb{background:var(--hairline); border-radius:8px;}
  main::-webkit-scrollbar-track{background:transparent;}

  .row{
    display:flex;
    gap:10px;
    max-width:88%;
    animation:rise 0.28s ease both;
  }

  @keyframes rise{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }

  .row.user{align-self:flex-end; flex-direction:row-reverse;}
  .row.bot{align-self:flex-start;}

  .bubble{
    padding:11px 14px;
    border-radius:var(--radius);
    font-size:14.5px;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
  }

  .row.bot .bubble{
    background:var(--bubble-bot);
    border:1px solid var(--hairline);
    border-top-left-radius:4px;
  }

  .row.user .bubble{
    background:var(--bubble-user);
    border:1px solid var(--amber-dim);
    border-top-right-radius:4px;
    color:#fbe2e2;
  }

  .mini-avatar{
    width:24px; height:24px;
    border-radius:50%;
    flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    margin-top:2px;
  }
  .row.bot .mini-avatar{background:var(--panel-raised); color:var(--amber); border:1px solid var(--hairline);}
  .row.user .mini-avatar{background:var(--amber-dim); color:var(--amber);}

  .timestamp{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--muted);
    margin-top:4px;
    opacity:0.7;
  }
  .row.user .timestamp{text-align:right;}

  .typing{
    align-self:flex-start;
    display:flex;
    gap:10px;
    padding-left:2px;
  }
  .typing .bubble{
    display:flex;
    align-items:center;
    gap:4px;
    padding:14px 16px;
  }
  .typing .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--muted);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing .dot:nth-child(2){animation-delay:0.15s;}
  .typing .dot:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0); opacity:0.5;}
    30%{transform:translateY(-4px); opacity:1;}
  }

  form{
    display:flex;
    align-items:flex-end;
    gap:10px;
    padding:16px 18px;
    border-top:1px solid var(--hairline);
    background:var(--panel);
    position:relative;
    z-index:1;
  }

  textarea{
    flex:1;
    resize:none;
    background:var(--panel-raised);
    border:1px solid var(--hairline);
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    line-height:1.4;
    padding:11px 14px;
    border-radius:12px;
    max-height:120px;
    min-height:44px;
    transition:border-color 0.15s;
  }
  textarea:focus{outline:none; border-color:var(--amber);}
  textarea::placeholder{color:var(--muted);}

  button.send{
    width:44px; height:44px;
    border-radius:12px;
    border:none;
    background:var(--amber);
    color:#fdeceb;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:transform 0.12s, background 0.15s;
  }
  button.send:hover{background:#f0505f;}
  button.send:active{transform:scale(0.94);}
  button.send:focus-visible{outline:2px solid var(--amber); outline-offset:3px;}
  button.send:disabled{opacity:0.4; cursor:not-allowed;}

  button.send svg{width:18px; height:18px;}

  .empty-hint{
    margin:auto;
    text-align:center;
    color:var(--muted);
    font-size:13px;
    max-width:220px;
    line-height:1.6;
  }

  @media (max-width:600px){
    body{padding:0;}
    .app{
      max-width:100%;
      height:100vh;
      border-radius:0;
      border:none;
    }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar"><img src="https://excelsis.com.py/wp-content/uploads/2025/08/logo.svg" alt="Excelsis logo"></div>
    <div class="header-text">
      <h1>Excelsis Assistant</h1>
      <div class="status"><span class="dot"></span>online</div>
    </div>
    <button class="clear-btn" id="clearBtn" type="button">clear</button>
  </header>

  <main id="messages">
    <div class="empty-hint" id="emptyHint">Say something below to start the conversation.</div>
  </main>

  <form id="chatForm">
    <textarea id="input" placeholder="Message Desk…" rows="1" aria-label="Message"></textarea>
    <button class="send" type="submit" id="sendBtn" aria-label="Send message">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </form>
</div>

<script>
  const form = document.getElementById('chatForm');
  const input = document.getElementById('input');
  const messages = document.getElementById('messages');
  const emptyHint = document.getElementById('emptyHint');
  const clearBtn = document.getElementById('clearBtn');
  const sendBtn = document.getElementById('sendBtn');

  function timeNow(){
    const d = new Date();
    return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  }

  function scrollToBottom(){
    messages.scrollTop = messages.scrollHeight;
  }

  function addMessage(text, sender){
    if(emptyHint) emptyHint.remove();

    const row = document.createElement('div');
    row.className = `row ${sender}`;

    const mini = document.createElement('div');
    mini.className = 'mini-avatar';
    mini.textContent = sender === 'user' ? 'You' : 'EX';

    const col = document.createElement('div');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    const stamp = document.createElement('div');
    stamp.className = 'timestamp';
    stamp.textContent = timeNow();

    col.appendChild(bubble);
    col.appendChild(stamp);
    row.appendChild(mini);
    row.appendChild(col);
    messages.appendChild(row);
    scrollToBottom();
  }

  function showTyping(){
    const row = document.createElement('div');
    row.className = 'row bot typing';
    row.id = 'typingRow';
    row.innerHTML = `
      <div class="mini-avatar">EX</div>
      <div class="bubble">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>`;
    messages.appendChild(row);
    scrollToBottom();
  }

  function hideTyping(){
    const t = document.getElementById('typingRow');
    if(t) t.remove();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if(!text) return;

    addMessage(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    showTyping();
    try{
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: text})
      });
      if(!res.ok) throw new Error('Request failed');
      const data = await res.json();
      hideTyping();
      addMessage(data.reply, 'bot');
    }catch(err){
      hideTyping();
      addMessage("Something went wrong reaching the server. Please try again.", 'bot');
    }finally{
      sendBtn.disabled = false;
      input.focus();
    }
  });

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      form.requestSubmit();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  clearBtn.addEventListener('click', () => {
    messages.innerHTML = '';
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.id = 'emptyHint';
    hint.textContent = 'Say something below to start the conversation.';
    messages.appendChild(hint);
  });
</script>

</body>
</html>
